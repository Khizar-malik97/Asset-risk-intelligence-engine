[project]
name = "asset-risk-intelligence-engine"
version = "0.1.0"
description = "Module 12 (Asset Intelligence Module) of the AXERONIX XDR Copilot platform"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic auto-generates migration files; they're not hand-authored and
# shouldn't be held to the same lint standard as the rest of the codebase.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core rules, I: import sorting, UP: pyupgrade,
# B: bugbear (common bug patterns), C4: comprehension cleanups
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
